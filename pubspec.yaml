name: resumesux_application
description: Contracts and usecases for ResumesUX clean architecture
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  fpdart: ^1.2.0
  resumesux_domain:
    git:
      url: https://github.com/staylorx/resumesux_domain
  args: ^2.5.0
  dotenv: ^4.2.0
  http: ^1.2.0
  yaml: ^3.1.0

dev_dependencies:
  dart_arch_test: ^0.3.1
  lints: ^6.0.0
  path: ^1.8.3
  test: ^1.28.0
  mocktail: ^1.0.4
  # Scripts contract (bible §2.1): CI/agents invoke `dart run melos run <task>`.
  melos: ^8.8.0

melos:
  useRootAsPackage: true
  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings
    test:
      run: dart test
    clean:deep:
      description: >
        Targeted deep clean of generated artifacts — removes .dart_tool/,
        build/, and .logs/ at the package root. Uses tool/clean_deep.dart (pure
        dart:io, cross-platform) rather than bare `git clean -fdx`, which would
        delete pubspec.lock (ignored via .gitignore) and .idea/. Never touches
        source, pubspec.yaml, .gitignore, or AGENTS.md.
      run: dart run tool/clean_deep.dart
