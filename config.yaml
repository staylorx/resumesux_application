config:
  customPrompt: "Generate professional content tailored to the job requirements."
  outputDir: "output"
  includeCover: true
  includeFeedback: true
  digestPath: "digest"
  folderOrder:
    - concern
    - applicant_name
    - jobreq_title
  applicant:
    name: "John Doe"
    preferred_name: "John"
    email: "john.doe@example.com"
    address:
      street1: "123 Main St"
      street2: "Apt 4B"
      city: "Anytown"
      state: "CA"
      zip: "12345"
    phone: "(555) 123-4567"
    linkedin: "https://linkedin.com/in/johndoe"
    github: "https://github.com/johndoe"
    portfolio: "https://johndoe.dev"
  providers:
    # Bring your own inference: set the provider's base URL and model, then
    # supply the API key via the environment (RESUMESUX_<PROVIDER>_KEY, see
    # .env.example) when the provider needs one. Keys are optional — local
    # providers (Ollama, LM Studio) need none.
    ollama:
      url: "http://192.168.1.230:11434"
      default: true
      models:
        - name: "qwen3.5:9b"
          default: true
          settings:
            temperature: 0.7
        - name: "gpt-oss-20b-agent:latest"
        - name: "gpt-oss:20b"
        - name: "gemma4:12b-it-qat"
        - name: "gemma4:12b"
        - name: "qwen3-coder:30b-nothink"
        - name: "llama3.2:3b-nothink"
    # lmstudio:
    #   url: "http://127.0.0.1:1234"
    #   default: false
    #   models:
    #     - name: "qwen2.5-7b-instruct"
    #       default: true
